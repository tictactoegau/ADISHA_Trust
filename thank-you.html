<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Thank You | ADISHA Trust Foundation</title>

  <link rel="icon" type="image/png" href="assets/images/favicon.png" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(213, 160, 51, 0.18), transparent 34%),
        linear-gradient(180deg, #fffaf1 0%, #fbf5e9 100%);
      color: #173f2a;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 680px;
      padding: 46px 34px;
      border: 1px solid rgba(213, 160, 51, 0.28);
      border-radius: 22px;
      background: rgba(255, 252, 246, 0.92);
      box-shadow: 0 18px 44px rgba(37, 35, 25, 0.14);
    }

    img {
      width: 74px;
      height: 74px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.1;
    }

    p {
      max-width: 560px;
      margin: 18px auto 0;
      color: #4f5b51;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      margin-top: 28px;
      padding: 12px 22px;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(135deg, #c94c0b, #ef7518);
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <img src="assets/images/logo-mark.png" alt="ADISHA Trust Foundation logo" />

    <h1>Thank You</h1>

    <p>
      Your donation interest has been received. ADISHA Trust Foundation will use your
      support to preserve Vedic wisdom, sacred ecology, education, Gau Seva, and living
      dharmic traditions.
    </p>

    <a href="index.html">Return Home</a>
  </main>
</body>
</html>
